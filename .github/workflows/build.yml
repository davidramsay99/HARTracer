# Builds, tests and packages HarLens on Windows.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build (warnings are errors)
        run: dotnet build -c Release -warnaserror --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Large-file checks (100 MB, 200,000 entries, 1 GB)
        env:
          HARLENS_LARGE_TESTS: "1"
        run: dotnet test tests/HarLens.Core.Tests -c Release --no-build --filter "FullyQualifiedName~Performance" --logger "console;verbosity=detailed"

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: HarLens-zips
          path: artifacts/*.zip

      - name: Installers
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          foreach ($arch in "x64", "arm64") {
            & $iscc.FullName "/DArch=$arch" "/DAppVersion=$version" installer\HarLens.iss
            if ($LASTEXITCODE -ne 0) { throw "installer for $arch failed" }
          }

      - name: Installer install and uninstall check
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts\*-x64-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/TASKS=harfiles" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\HarLens\HarLens.exe"
          if (-not (Test-Path $exe)) { throw "HarLens.exe was not installed to $exe" }
          if (-not (Test-Path "HKCU:\Software\Classes\HarLens.har\shell\open\command")) { throw ".har association missing" }
          Start-Process "$env:LOCALAPPDATA\Programs\HarLens\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # The uninstaller hands off to a copy of itself; wait for it to finish.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "uninstall left HarLens.exe behind" }
          if (Test-Path "HKCU:\Software\Classes\HarLens.har") { throw "uninstall left the .har association behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: HarLens-installers
          path: artifacts/*-setup.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
