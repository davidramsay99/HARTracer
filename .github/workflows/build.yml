# Builds, tests and packages HarLens on Windows (SPEC 11, 12).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build (warnings are errors)
        run: dotnet build -c Release -warnaserror --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Large-file checks (100 MB, 200,000 entries, 1 GB)
        env:
          HARLENS_LARGE_TESTS: "1"
        run: dotnet test tests/HarLens.Core.Tests -c Release --no-build --filter "FullyQualifiedName~Performance" --logger "console;verbosity=detailed"

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: HarLens-zips
          path: artifacts/*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
